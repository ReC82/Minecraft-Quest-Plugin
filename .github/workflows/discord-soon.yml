name: Discord upcoming work
on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Announcement issue number
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: discord-soon-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && (github.event.action == 'edited' || github.event.label.name == 'discord-soon-publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SOON_WEBHOOK_URL }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const {data: issue} = await github.rest.issues.get({owner, repo, issue_number});
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            if (issue.pull_request || issue.user.login !== owner || !labels.includes('annonce-soon') || !labels.includes('discord-soon-publish')) {
              core.info('Not an authorized announcement.'); return;
            }
            const url = process.env.DISCORD_WEBHOOK;
            if (!url) throw new Error('DISCORD_SOON_WEBHOOK_URL is missing');
            const base = new URL(url);
            if (base.hostname !== 'discord.com' || !base.pathname.startsWith('/api/webhooks/')) throw new Error('Invalid Discord webhook configuration');
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const marker = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- discord-soon-state:'));
            let state = marker ? JSON.parse(marker.body.split('\n')[1]) : {};
            const content = '**' + issue.title + '**\n\n' + (issue.body || '');
            if (content.length > 2000) throw new Error('Announcement exceeds 2000 characters; shorten the issue before publishing');
            const crypto = require('crypto');
            const hash = crypto.createHash('sha256').update(content).digest('hex');
            if (state.hash === hash && state.message_id) { core.info('Already synchronized'); return; }
            if (state.pending) throw new Error('Previous send has uncertain delivery. Inspect Discord before resetting the state marker.');
            if (!state.message_id && context.eventName === 'issues' && context.payload.action === 'edited') { core.info('Draft edit: not published'); return; }
            async function save(s) {
              const body = '<!-- discord-soon-state:v1 -->\n' + JSON.stringify(s);
              if (marker) await github.rest.issues.updateComment({owner, repo, comment_id: marker.id, body});
              else {
                const {data} = await github.rest.issues.createComment({owner, repo, issue_number, body});
                comments.push(data);
                return data;
              }
            }
            let stateComment = marker;
            if (!state.message_id) {
              stateComment = await save({pending: true});
            }
            const endpoint = new URL(base);
            if (state.message_id) endpoint.pathname += '/messages/' + state.message_id;
            else endpoint.searchParams.set('wait', 'true');
            let response;
            try {
              response = await fetch(endpoint, {
                method: state.message_id ? 'PATCH' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content, allowed_mentions: {parse: []}}),
                signal: AbortSignal.timeout(20000)
              });
            } catch (_) {
              throw new Error('Discord request failed; secret URL omitted. Inspect delivery before retrying a new message.');
            }
            if (!response.ok) {
              if (!state.message_id && response.status >= 400 && response.status < 500) {
                await github.rest.issues.updateComment({owner, repo, comment_id: stateComment.id, body: '<!-- discord-soon-state:v1 -->\n{}'});
              }
              throw new Error('Discord returned HTTP ' + response.status);
            }
            const message = await response.json();
            const next = {message_id: message.id, channel_id: message.channel_id, hash};
            await github.rest.issues.updateComment({owner, repo, comment_id: stateComment.id, body: '<!-- discord-soon-state:v1 -->\n' + JSON.stringify(next)});
            core.summary.addLink('Discord announcement', 'https://discord.com/channels/@me/' + message.channel_id + '/' + message.id);
            await core.summary.write();
