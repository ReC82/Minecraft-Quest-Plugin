# PlugAdmin — RPGQuest Control Panel (issue #44)
# Reverse proxy DÉDIÉ : plugadmin.lodylands.com -> 127.0.0.1:8090
#
# Installé par scripts/plugadmin/install.sh en
#   /etc/nginx/sites-available/plugadmin  (+ symlink dans sites-enabled/).
#
# CE FICHIER EST LA VERSION « AVANT CERTBOT ».
# `certbot --nginx -d plugadmin.lodylands.com` transforme ensuite ce bloc :
#   - il ajoute `listen 443 ssl` + les directives ssl_certificate* ;
#   - il ajoute un second `server { listen 80; ... return 301 https://... }`.
# Après Certbot, ne plus éditer ce fichier à la main sans refaire `nginx -t`.
#
# NE TOUCHE À AUCUN autre vhost (dig, lodyland). server_name strictement limité
# au sous-domaine PlugAdmin -> aucun risque de capter le trafic des autres sites.

server {
    listen 80;
    listen [::]:80;
    server_name plugadmin.lodylands.com;

    # Taille de payload : le panel n'accepte que de petits formulaires (sauf la route
    # d'upload d'image ci-dessous, #283).
    client_max_body_size 256k;

    access_log /var/log/nginx/plugadmin_access.log;
    error_log  /var/log/nginx/plugadmin_error.log;

    # Images de référence de l'Atelier IA (#283) : la seule route qui reçoit un fichier.
    # PlugAdmin accepte 4 Mio par image (+ 64 Kio d'enveloppe multipart) et répond lui-même
    # jusqu'à 5 Mo ; au-delà, nginx renvoie sur le projet (id/draft passés dans l'URL du
    # formulaire) avec un message clair, au lieu de sa page 413 brute.
    location = /buildings/workshop/image {
        client_max_body_size 5m;
        error_page 413 = @workshop_image_too_large;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    location @workshop_image_too_large {
        return 303 "/buildings/workshop/project?id=$arg_id&draft=$arg_draft&err=Image%20trop%20lourde%20%3A%204%20Mio%20au%20plus%20par%20image%20%28PNG%2C%20JPEG%2C%20WebP%20ou%20GIF%29.%20Enregistrez-la%20en%20JPEG%20ou%20r%C3%A9duisez-la%20%281600%20pixels%20de%20large%20suffisent%29%2C%20puis%20recommencez.%20Rien%20n%27a%20%C3%A9t%C3%A9%20enregistr%C3%A9%20%3B%20le%20projet%20et%20sa%20description%20sont%20intacts.";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Pas de mise en cache d'une UI d'administration.
        proxy_buffering off;
    }
}
