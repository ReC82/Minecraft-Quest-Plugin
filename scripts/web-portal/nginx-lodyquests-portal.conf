# Portail public LodyQuests (issue #52)
# Reverse proxy DÉDIÉ : lodyquests.lodylands.com -> 127.0.0.1:8092 (web-api RPGQuest)
#
# Installé par scripts/web-portal/install.sh en
#   /etc/nginx/sites-available/lodyquests-portal  (+ symlink dans sites-enabled/).
#
# CE FICHIER EST LA VERSION « AVANT CERTBOT ». `certbot --nginx -d lodyquests.lodylands.com`
# y ajoute ensuite `listen 443 ssl`, les directives ssl_certificate* et la redirection 80 -> 443.
# Après Certbot, ne plus éditer ce fichier à la main sans refaire `nginx -t`.
#
# Ne touche à AUCUN autre vhost (dig, jury-central, kestrel, lodyland, plugadmin, video) :
# server_name strictement limité au sous-domaine du portail.

limit_req_zone $binary_remote_addr zone=lodyquests_portal:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lodyquests.lodylands.com;

    # Le portail V1 est en lecture seule : aucun envoi de fichier, seulement de petits formulaires.
    client_max_body_size 64k;

    access_log /var/log/nginx/lodyquests_portal_access.log;
    error_log  /var/log/nginx/lodyquests_portal_error.log;

    # En-têtes de sécurité d'un site public sans script tiers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # L'API /api/* est réservée aux outils authentifiés : jamais exposée au public.
    location /api/ {
        return 404;
    }

    location / {
        limit_req zone=lodyquests_portal burst=20 nodelay;

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Lu par le web-api (trust-proxy-headers=true) pour limiter la fréquence par visiteur.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }
}
