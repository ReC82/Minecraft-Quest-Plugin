# Configuration de RPGQuest.
# Valeurs invalides : le plugin refuse de démarrer (ou de recharger via
# /rpgquest reload) avec un message expliquant précisément le problème.

debug: false

# Code de langue ISO 639-1 (ex. fr, en).
locale: fr

database:
  # Nom du fichier SQLite, créé dans le dossier de données du plugin
  # (plugins/RPGQuest/<database.file>). Doit être un simple nom de fichier.
  file: data.db

resource-pack:
  # Le plugin démarre normalement même si le resource pack est désactivé
  # ou inaccessible.
  enabled: false
  url: ""
  sha1: ""
  # Si true, un refus/échec de téléchargement affiche un message d'avertissement
  # au joueur (aucune déconnexion automatique dans tous les cas : le plugin
  # doit fonctionner sans le resource pack).
  required: false

dialogue:
  # Renderer utilisé pour afficher les dialogues :
  #   - paper-dialog : vraie fenêtre Paper native avec boutons cliquables (par défaut). Repose sur
  #                    une API Paper marquée expérimentale par Paper lui-même (le contrat pourrait
  #                    changer dans une future version de Paper), mais réelle et fonctionnelle contre
  #                    la version exacte ciblée par ce projet ; repli automatique sur le chat en cas
  #                    d'échec à l'exécution. Voir docs/ARCHITECTURE.md.
  #   - chat         : texte cliquable dans le chat, compatible avec tout client, aucune API
  #                    instable — à choisir explicitement si vous préférez l'éviter.
  renderer: paper-dialog
  # Liste blanche des commandes autorisées dans l'action RUN_SAFE_COMMAND
  # d'un dialogue (nom de la commande seul, sans le "/" ni les arguments).
  # Aucune commande hors de cette liste ne peut être exécutée par un dialogue.
  allowed-commands:
    - "give"
    - "xp"
    - "customitem"
    - "claim"

journal:
  # Affiche une bossbar de suivi (titre + progression) pour la quête suivie
  # via /quests. Purement cosmétique : la mettre à false ne désactive ni le
  # suivi lui-même (persisté) ni le journal, seulement la bossbar.
  tracker-enabled: true

claims:
  # Limites d'un claim de terrain (/claim create). max-claims-per-player est
  # une base : +1 claim tous les 10 niveaux de la piste GLOBAL (voir
  # docs/PROGRESSION.md) ; max-width/max-height restent fixes pour tous.
  max-width: 64
  max-height: 384
  max-claims-per-player: 3
  # Distance minimale (en blocs) entre un nouveau claim et n'importe quel portail existant.
  portal-buffer-blocks: 16
  # Nom exact du monde dédié au premier claim via l'Acte de propriété (voir
  # claim.DeedClaimListener / claim.ClaimsWorldRulesListener) : clic droit avec l'Acte hors de ce
  # monde est refusé proprement. N'affecte pas /claim create à la baguette (utilisable dans
  # n'importe quel monde autre que le Hub). PvP et tout dégât joueur y sont désactivés (zone
  # résidentielle totalement safe) ; jour/nuit et météo restent normaux (contrairement au Hub).
  world: claims
  # Tant que le rôle futur du Nether n'est pas décidé, un portail Nether activé depuis ce monde est
  # refusé (message au joueur, aucun impact sur le Nether lui-même ni sur les autres mondes/portails
  # RPGQuest). Simple bascule pour réautoriser plus tard.
  block-nether-travel: true

progression:
  # Courbe de niveaux (par compétence) : coût du niveau n -> n+1 =
  # base-xp * growth-factor^(n-1), arrondi. Voir docs/PROGRESSION.md pour le
  # modèle d'équilibrage complet.
  base-xp: 100
  growth-factor: 1.15
  max-level: 100
  # Fraction de l'XP d'une compétence spécifique aussi accordée à la piste
  # globale (0.0 = pas de mirroir, 1.0 = mirroir intégral).
  global-mirror-ratio: 0.5
  # Anti-farm (répétition excessive) : au-delà, les octrois supplémentaires
  # sur une même compétence sont ignorés jusqu'à la minute suivante.
  max-grants-per-minute: 60
  display-mode: action_bar       # action_bar | boss_bar | off
  # L'XP/niveau vanilla (enchantements) reste intacte et indépendante de
  # cette progression RPG (mission point 10) : ne désactiver que si un autre
  # système gère déjà l'XP vanilla.
  keep-vanilla-xp: true
  # XP RPG (piste globale) accordée une seule fois à la fin de chaque quête,
  # en plus de la récompense « experience » vanilla éventuelle de la quête.
  quest-completion-xp: 50
  sources:
    # Montant plat par action ; voir docs/PROGRESSION.md pour le modèle
    # d'équilibrage complet (pourquoi plat, pas par matériau/mob).
    combat-kill-xp: 15
    mining-block-xp: 5
    farming-harvest-xp: 4
    fishing-catch-xp: 10
    exploration-zone-xp: 100

backpacks:
  # Nombre de lignes (9 cases chacune) par palier ; doit rester strictement
  # croissant. Voir docs/BACKPACKS.md pour le détail complet.
  small-rows: 1
  medium-rows: 3
  large-rows: 6
  # Matériaux jamais autorisés dans un backpack (ex. coffres à coquillage
  # pour éviter les contournements de duplication liés aux conteneurs
  # imbriqués). Vide par défaut : l'item d'ouverture lui-même est toujours
  # interdit (anti-imbrication), quel que soit ce réglage.
  forbidden-materials: []
  # Palier accordé par la permission de secours (rpgquest.backpack.free) à
  # un joueur sans avantage backpack explicite.
  fallback-size: SMALL
  open-item-material: BUNDLE

web-export:
  # Export périodique en lecture seule pour le module web-api séparé (voir
  # docs/WEB_API.md) : ce dernier n'accède jamais à data.db directement, il
  # lit uniquement web-export/snapshot.json produit ici. Désactivé par
  # défaut (aucun fichier écrit tant que enabled reste false).
  enabled: false
  # Sous-dossier du dossier de données du plugin (plugins/RPGQuest/<output-dir>/snapshot.json).
  output-dir: web-export
  interval-seconds: 30
  # Inclut la liste nominative des joueurs connectés dans le snapshot, en
  # plus du simple nombre. false par défaut (vie privée).
  include-connected-players: false
  leaderboard-size: 10
  # Vide = toutes les pistes de progression (voir docs/PROGRESSION.md).
  leaderboard-skills: []
  # Actualités/annonces statiques exposées par le portail (mission point 3),
  # aucune n'est configurée par défaut.
  announcements: []

store:
  # Sondage des livraisons de la boutique web (mission étape 22) : le jeton
  # serveur-à-serveur n'est jamais ici, uniquement dans la variable
  # d'environnement RPGQUEST_WEB_API_TOKEN (même secret que web-api, voir
  # docs/WEB_API.md). Désactivé par défaut.
  enabled: false
  web-api-base-url: "http://localhost:8080"
  poll-interval-seconds: 30

client-mod:
  # Détection de compatibilité avec le mod client prototype (mission étape
  # 23, voir docs/CLIENT_MOD.md). false (par défaut) : client vanilla
  # autorisé avec repli, aucune restriction. true : mod obligatoire (kick
  # sinon) — à activer uniquement en connaissance de cause.
  require-mod: false
  handshake-timeout-ticks: 60

hub:
  # Nom exact du monde Hub (voir hub.HubWorldRulesService / hub.HubWorldProtectionListener) :
  # jour et météo verrouillés en permanence, aucun dégât aux joueurs, aucun mob hostile naturel,
  # casse/pose de bloc interdite (sauf rpgquest.admin.world), claims interdits. Géré entièrement
  # par le plugin, jamais par une commande /gamerule manuelle. Fonctionne que ce monde soit chargé
  # avant ou après RPGQuest (ex. par Multiverse-Core).
  world: world_hub

travel:
  # Nom exact du monde d'exploration (voir config.TravelConfig) : la Rune de rappel n'y fonctionne
  # que là, l'avertissement d'entrée ne concerne que les portails qui y mènent, et c'est le seul
  # monde où des Waystones sont générées.
  wild-world: wild
  rune:
    # Rune de rappel (travel.ItemTravelService) : canalisation de retour au Hub depuis le Wild
    # (annulée sur mouvement/dégâts) et cooldown après un usage réussi. Le cooldown est persisté
    # par joueur (survit à une reconnexion/redémarrage). La Rune n'est jamais consommée.
    channel-seconds: 10
    cooldown-seconds: 1800
  waystone:
    # Génération paresseuse de Waystones dans travel.wild-world (voir waystone.WaystoneService) :
    # au plus une par cellule carrée de « cell-size » blocs de côté, décidée de façon déterministe
    # à partir de la seed du monde + des coordonnées de la cellule (donc identique à chaque
    # reload/redémarrage, jamais de doublon). « chance » = probabilité (0..1) qu'une cellule en
    # contienne une ; « minimum-spacing » = distance minimale entre deux Waystones ; « safe-attempts »
    # = essais de recherche d'une surface sûre autour du point candidat ; « channel-seconds » =
    # canalisation d'un retour au Hub depuis une Waystone (annulée sur mouvement/dégâts).
    cell-size: 1000
    chance: 0.6
    minimum-spacing: 300
    safe-attempts: 16
    channel-seconds: 3
  random-safe-arrival:
    # Arrivée d'un portail simple (/rpgadmin worldportal) en stratégie RANDOM_SAFE — voir
    # docs-site/worlds.html, section "Portail Hub → wild". Distance autour du spawn du monde
    # destination (pas du portail lui-même) ; max-attempts borne le nombre d'essais avant repli
    # automatique sur le spawn du monde (jamais de boucle infinie).
    min-radius: 500
    max-radius: 5000
    max-attempts: 20

admin:
  flatten:
    # /rpgadmin flatten <rayon> [hauteur] — voir docs/ADMIN_FLATTEN.md.
    max-radius: 48
    default-shape: SQUARE          # SQUARE | CIRCLE
    top-layer-material: GRASS_BLOCK
    sub-layer-material: DIRT
    sub-layer-depth: 3
    clear-above-height: 10
    confirmation-timeout-seconds: 30
    blocks-per-tick: 4000
    # Aucune zone interdite par défaut ; noms de mondes exacts.
    forbidden-worlds: []
