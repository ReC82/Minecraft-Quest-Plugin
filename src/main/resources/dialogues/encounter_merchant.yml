# Dialogue des PNJ récurrents « Marchand égaré » (issue #13). Partagé par TOUTES les occurrences de ce
# modèle (id = npc_id du modèle, convention du projet) : le PNJ est commun, la conversation et les
# quêtes restent propres à chaque joueur. Les quêtes secondaires renouvelables s'ajoutent ici.
id: rpgquest:encounter_merchant
start: greeting

nodes:
  greeting:
    speaker: "Marchand égaré"
    text: "<white>Enfin un visage ! J'ai perdu ma caravane dans ces sables… Tu n'aurais pas croisé des chameaux ?</white>"
    choices:
      - text: "Qui es-tu ?"
        next: who
      - text: "Au revoir"
        actions:
          - type: CLOSE

  who:
    speaker: "Marchand égaré"
    text: "<gray>Un voyageur, comme toi. On me croise un peu partout dans ce genre de contrée.</gray> <white>Reviens me voir : j'aurai bientôt quelques courses à te confier.</white>"
    choices:
      - text: "À bientôt"
        actions:
          - type: CLOSE
