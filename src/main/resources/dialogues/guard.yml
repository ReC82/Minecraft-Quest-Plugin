id: rpgquest:guard
start: greeting

nodes:
  greeting:
    speaker: "Garde"
    text: "<white>Bienvenue voyageur. Le village a besoin d'aide.</white>"
    choices:
      - text: "J'accepte la quête"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:first_steps
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:first_steps
        next: accepted
      - text: "J'ai entendu dire que tu avais besoin d'aide pour forger un équipement"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:first_steps
            state: COMPLETED
          - type: QUEST_STATE
            quest: rpgquest:crystal_hunt
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:crystal_hunt
        next: crystal_hunt_accepted
      - text: "Je veux prouver ma valeur pour obtenir un bout de terrain (palier 1)"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier1
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:guard_tier1
        next: guard_tier1_accepted
      - text: "Je veux agrandir mon terrain (palier 2)"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier1
            state: COMPLETED
          - type: QUEST_STATE
            quest: rpgquest:guard_tier2
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:guard_tier2
        next: guard_tier2_accepted
      - text: "Je veux encore agrandir mon terrain (palier 3)"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier2
            state: COMPLETED
          - type: QUEST_STATE
            quest: rpgquest:guard_tier3
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:guard_tier3
        next: guard_tier3_accepted
      - text: "Je veux encore agrandir mon terrain (palier 4)"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier3
            state: COMPLETED
          - type: QUEST_STATE
            quest: rpgquest:guard_tier4
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:guard_tier4
        next: guard_tier4_accepted
      - text: "Je veux encore agrandir mon terrain (palier 5)"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier4
            state: COMPLETED
          - type: QUEST_STATE
            quest: rpgquest:guard_tier5
            state: NOT_STARTED
        actions:
          - type: START_QUEST
            quest: rpgquest:guard_tier5
        next: guard_tier5_accepted
      - text: "J'ai fini tout ce que tu m'as demandé pour mon terrain"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:guard_tier5
            state: COMPLETED
        next: guard_tiers_done
      # Issue #24 : choix PERMANENT (aucune condition) — le joueur demande lui-même l'état du
      # Wild, l'information n'est jamais poussée dans l'avertissement du portail (issue #161).
      - text: "Comment est le Wild actuellement ?"
        next: wild_conditions
      # Issue #123 : branche de remise d'objets, entièrement GÉNÉRIQUE — aucune quête, aucun
      # matériau et aucun PNJ n'est nommé ici. HAS_PENDING_DELIVERY n'est vraie que si une quête
      # active du joueur demande de remettre des objets à CE PNJ (déduit de la clé du dialogue,
      # « rpgquest:guard » → PNJ « guard ») : le choix reste donc invisible le reste du temps, et
      # ces trois nœuds peuvent être recopiés tels quels dans le dialogue d'un autre PNJ.
      - text: "J'ai des matériaux à te remettre"
        conditions:
          - type: HAS_PENDING_DELIVERY
        next: delivery
      - text: "Parle-moi de la récompense"
        next: reward_info
      - text: "Non merci"
        next: refused

  # Le texte est rendu dynamiquement : %wild_conditions% est remplacé juste avant l'affichage par
  # l'état RÉEL du monde d'exploration (jour/nuit + météo globale), voir
  # travel.WildConditionsService et dialogue.DialogueTextPlaceholders. Rien n'est modifié dans le
  # Wild par cette lecture.
  wild_conditions:
    speaker: "Garde"
    text: "<white>%wild_conditions%</white>"
    choices:
      - text: "Merci pour l'information"
        next: greeting

  # Issue #123 — %delivery_status% liste ce qui a déjà été remis et ce qui manque, matériau par
  # matériau, lu sur la progression réelle juste avant l'affichage. « Donner les matériaux que
  # j'ai » traite TOUS les objectifs de remise de ce PNJ en une seule fois : il ne retire jamais
  # plus que le reliquat, et ce qui est remis est acquis définitivement (survit à la mort, à une
  # reconnexion et à un redémarrage).
  delivery:
    speaker: "Garde"
    text: "<white>Voilà où nous en sommes :</white><newline>%delivery_status%"
    choices:
      - text: "Donner les matériaux que j'ai"
        actions:
          - type: DELIVER_QUEST_ITEMS
        next: delivery_after
      - text: "Je reviendrai plus tard"
        actions:
          - type: CLOSE

  delivery_after:
    speaker: "Garde"
    text: "<white>%delivery_status%</white>"
    choices:
      # Dépôt partiel : le joueur peut enchaîner s'il a encore quelque chose d'utile.
      - text: "Donner encore des matériaux"
        conditions:
          - type: HAS_PENDING_DELIVERY
        actions:
          - type: DELIVER_QUEST_ITEMS
        next: delivery_after
      # Tout est remis : la même condition niée fait basculer vers le nœud de fin, sans qu'aucun
      # second type de condition soit nécessaire.
      - text: "Et voilà, tout est remis"
        conditions:
          - type: HAS_PENDING_DELIVERY
            negate: true
        next: delivery_done
      - text: "Je reviendrai plus tard"
        actions:
          - type: CLOSE

  delivery_done:
    speaker: "Garde"
    text: "<gold>Tu as remis tout ce que je t'avais demandé. C'est en sécurité ici.</gold>"
    choices:
      - text: "Parfait"
        actions:
          - type: CLOSE

  accepted:
    speaker: "Garde"
    text: "<green>Bien ! Reviens me voir une fois prêt.</green>"
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  crystal_hunt_accepted:
    speaker: "Garde"
    text: >
      <green>Ramène-moi des crocs d'araignée et des cristaux raffinés, et
      forge une lame digne de ce nom. Reviens me voir une fois la lame
      forgée.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tier1_accepted:
    speaker: "Garde"
    text: >
      <green>Fais tes preuves : élimine 5 araignées, 5 zombies, 5 squelettes
      et 5 creepers. Reviens me voir une fois les quatre menaces repoussées.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tier2_accepted:
    speaker: "Garde"
    text: >
      <green>Un terrain plus grand, un effort plus grand : 10 araignées,
      10 zombies, 10 squelettes et 10 creepers. Reviens me voir une fois
      les quatre menaces repoussées.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tier3_accepted:
    speaker: "Garde"
    text: >
      <green>Toujours plus : 20 araignées, 20 zombies, 20 squelettes et
      20 creepers. Reviens me voir une fois les quatre menaces repoussées.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tier4_accepted:
    speaker: "Garde"
    text: >
      <green>Peu de villageois tiennent ce rythme : 40 araignées, 40 zombies,
      40 squelettes et 40 creepers. Reviens me voir une fois les quatre
      menaces repoussées.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tier5_accepted:
    speaker: "Garde"
    text: >
      <green>Le dernier effort que je te demande : 80 araignées, 80 zombies,
      80 squelettes et 80 creepers. Reviens me voir une fois les quatre
      menaces repoussées.</green>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  guard_tiers_done:
    speaker: "Garde"
    text: >
      <gold>Tu as largement prouvé ta valeur au village. Je n'ai rien de
      plus à te confier pour ton terrain pour l'instant — mais le village
      n'oubliera pas.</gold>
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  reward_info:
    speaker: "Garde"
    text: "<gray>Tu recevras de l'expérience et une épée en fer en récompense.</gray>"
    choices:
      - text: "Retour"
        next: greeting

  refused:
    speaker: "Garde"
    text: "<gray>Comme tu voudras. Reviens me voir si tu changes d'avis.</gray>"
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE
