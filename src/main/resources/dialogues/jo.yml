# PNJ Jo (Citizens), créé/configuré manuellement par un administrateur — voir
# docs/NPC_DIALOGUES_QUESTS_GUIDE.md, section 6 (/rpgadmin npc tag jo). Ce fichier ne crée jamais
# le PNJ lui-même, seulement son dialogue logique (id = id NPC, convention du projet).
#
# Condition réelle du premier claim (issues #21/#22/#23) : la variable CLAIM_TIER_1 == "true",
# accordée par la quête « Gauthier — Palier 1 » (rpgquest:guard_tier1, rendue à Gauthier, le garde
# du village — voir quests/guard_tier1.yml). Depuis #778, l'ancienne voie rpgquest:crystal_hunt est
# retirée. Jo se contente de constater cet état, jamais de l'accorder.
#
# Jo adapte donc son dialogue aux 3 états du joueur (mission « Jo adapte son dialogue ») :
#   (a) claim NON débloqué  -> « Comment obtenir mon premier terrain ? » (CLAIM_TIER_1 != "true"
#       ET aucun claim) : Jo explique qu'il faut rendre « Gauthier — Palier 1 » à Gauthier ;
#   (b) claim débloqué mais AUCUN claim posé (CLAIM_TIER_1 == "true" ET NO_MAIN_CLAIM) : Jo remet
#       l'Acte de propriété — UN SEUL à la fois (#72) : redonné seulement s'il n'est plus dans
#       l'inventaire (le perdre n'empêche jamais de le redemander), et seulement s'il y a la place
#       de le recevoir (#85, sinon Jo le dit et rien ne tombe au sol) ;
#   (c) claim EXISTANT (HAS_MAIN_CLAIM) : « me rendre sur ma propriété », « revoir les limites »,
#       « obtenir une Pierre de retour ».
#
# Règles (mission « Jo : retourner à son claim ») :
# - « Me rendre sur ma propriété » n'est visible que si le joueur possède déjà un claim principal
#   (HAS_MAIN_CLAIM, strict opposé de NO_MAIN_CLAIM) ;
# - jamais de coordonnées ici : l'action déclenche /claim admin sendhome (RUN_SAFE_COMMAND, "claim"
#   whitelisté dans config.yml → dialogue.allowed-commands), qui résout le claim persistant du joueur
#   et cherche une position sûre à chaque appel — fonctionne après reconnexion/redémarrage ;
# - le portail Hub -> claims reste le seul moyen d'explorer avant de poser son premier claim : Jo ne
#   fait qu'offrir un accès rapide à une propriété déjà existante, jamais une alternative au portail.
#
# Règles (mission « MVP du monde claims » — visualisation des limites / Pierre de retour) :
# - « Revoir les limites de ma propriété » (re)donne l'Acte de propriété, désormais un outil de
#   visualisation non consommable une fois un claim posé (voir claim.DeedClaimListener) — visible
#   seulement si le joueur a un claim principal ET n'a pas déjà l'Acte en poche (LACKS_CUSTOM_ITEM),
#   pour ne jamais permettre d'en farmer inutilement ;
# - « Obtenir une Pierre de retour » donne l'objet de voyage claims -> Hub (travel.ItemTravelService),
#   même garde LACKS_CUSTOM_ITEM ; objet permanent, jamais consommé, donc l'option redevient
#   invisible dès qu'il est en poche et ne réapparaît que s'il est perdu. Une Pierre de retour est
#   de toute façon donnée automatiquement à l'arrivée dans le monde des claims si elle manque
#   (claim.ClaimWorldSafetyListener) : cette option n'est qu'un rappel depuis le village.
id: rpgquest:jo
start: greeting

nodes:
  greeting:
    speaker: "Jo"
    text: "<white>Bonjour voyageur ! Que puis-je faire pour toi ?</white>"
    choices:
      - text: "Mon premier terrain"
        conditions:
          - type: VARIABLE_EQUALS
            key: CLAIM_TIER_1
            value: "true"
            negate: true
          - type: NO_MAIN_CLAIM
        next: how_to_unlock
      # Issues #72 / #85 : l'acte n'est remis que s'il n'est pas déjà dans l'inventaire ET qu'il y
      # a la place de le recevoir. Les deux autres cas affichent le MÊME libellé mais mènent à une
      # explication, jamais à une seconde remise ni à un objet jeté au sol. Les conditions sont
      # réévaluées au clic, et un seul choix à la fois est traité par joueur (anti-double-clic).
      - text: "Réclamer mon acte"
        conditions:
          - type: VARIABLE_EQUALS
            key: CLAIM_TIER_1
            value: "true"
          - type: NO_MAIN_CLAIM
          - type: LACKS_CUSTOM_ITEM
            item: rpgquest:acte_propriete
          - type: HAS_INVENTORY_SPACE
        actions:
          - type: RUN_SAFE_COMMAND
            command: "customitem give %player% rpgquest:acte_propriete 1"
        next: deed_given
      - text: "Réclamer mon acte"
        conditions:
          - type: VARIABLE_EQUALS
            key: CLAIM_TIER_1
            value: "true"
          - type: NO_MAIN_CLAIM
          - type: LACKS_CUSTOM_ITEM
            item: rpgquest:acte_propriete
          - type: HAS_INVENTORY_SPACE
            negate: true
        next: deed_inventory_full
      - text: "Réclamer mon acte"
        conditions:
          - type: VARIABLE_EQUALS
            key: CLAIM_TIER_1
            value: "true"
          - type: NO_MAIN_CLAIM
          - type: LACKS_CUSTOM_ITEM
            item: rpgquest:acte_propriete
            negate: true
        next: deed_already_held
      - text: "Me rendre sur ma propriété"
        conditions:
          - type: HAS_MAIN_CLAIM
        actions:
          - type: RUN_SAFE_COMMAND
            command: "claim admin sendhome %player%"
          - type: CLOSE
      - text: "Revoir mes limites"
        conditions:
          - type: HAS_MAIN_CLAIM
          - type: LACKS_CUSTOM_ITEM
            item: rpgquest:acte_propriete
          - type: HAS_INVENTORY_SPACE
        actions:
          - type: RUN_SAFE_COMMAND
            command: "customitem give %player% rpgquest:acte_propriete 1"
          - type: CLOSE
      # Issue #22 : exiger HAS_MAIN_CLAIM rendait ce recours inaccessible exactement quand il
      # sert — un joueur qui a son droit débloqué mais pas encore posé de terrain. La condition
      # reprend donc l'éligibilité du filet de sécurité : le déblocage suffit.
      - text: "Obtenir une Pierre de retour"
        conditions:
          - type: VARIABLE_EQUALS
            key: CLAIM_TIER_1
            value: "true"
          - type: LACKS_CUSTOM_ITEM
            item: rpgquest:pierre_retour
        actions:
          - type: RUN_SAFE_COMMAND
            command: "customitem give %player% rpgquest:pierre_retour 1"
          - type: CLOSE
      - text: "Rien pour le moment, merci"
        actions:
          - type: CLOSE

  how_to_unlock:
    speaker: "Jo"
    text: "<gray>Le droit de poser ton premier terrain se mérite. Va d'abord voir <white>Gauthier</white>, le garde du village : sa quête <white>Gauthier — Palier 1</white> te demande de repousser les menaces autour des murs. Une fois cette quête rendue, ce droit t'est acquis — reviens me voir, je te remettrai ton acte de propriété.</gray>"
    choices:
      - text: "Compris, merci Jo"
        actions:
          - type: CLOSE

  deed_given:
    speaker: "Jo"
    text: "<green>Tiens, voici ton acte de propriété !</green> <gray>Passe par le portail vers le monde des claims et fais un clic droit avec pour poser ton premier terrain. Tu recevras une Pierre de retour en arrivant là-bas : un clic droit avec elle te ramènera au village.</gray>"
    choices:
      - text: "Merci Jo"
        actions:
          - type: CLOSE

  deed_already_held:
    speaker: "Jo"
    text: "<yellow>Tu as déjà ton acte de propriété dans ton inventaire.</yellow> <gray>Je n'en remets qu'un : passe par le portail vers le monde des claims et fais un clic droit avec pour poser ton premier terrain.</gray>"
    choices:
      - text: "D'accord"
        actions:
          - type: CLOSE

  deed_inventory_full:
    speaker: "Jo"
    text: "<red>Ton inventaire est plein</red> <gray>: je ne peux pas te remettre ton acte de propriété. Libère une place, puis reviens me parler — il t'attend, rien n'est perdu.</gray>"
    choices:
      - text: "Je reviens"
        actions:
          - type: CLOSE
