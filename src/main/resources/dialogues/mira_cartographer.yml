# Dialogue RPGQuest — généré via le Control Panel (squelette éditable).
# L'édition fine (nœuds, choix conditionnels, actions) passera par l'éditeur dédié.
id: rpgquest:mira_cartographer
start: accueil
nodes:
  accueil:
    speaker: "<yellow><bold>Mira la Cartographe</bold></yellow>"
    text: "Bonjour, aventurier ! Que puis-je faire pour toi aujourd'hui ?"
    choices:
      - text: "Qui es-tu ?"
        next: presentation
      - text: "Quel type de missions proposes-tu ?"
        next: missions
      - text: "Pourquoi les waypoints sont-ils importants ?"
        next: waypoints_importance
      - text: "Merci, à plus tard."
        actions:
          - type: CLOSE
  presentation:
    speaker: "<yellow><bold>Mira la Cartographe</bold></yellow>"
    text: "Je suis Mira, l'exploratrice et cartographe du village. J'adore arpenter les contrées sauvages du Wild pour en créer de magnifiques cartes. Rejoins-moi pour une aventure !"
    choices:
      - text: "Retour"
        next: accueil
  missions:
    speaker: "<yellow><bold>Mira la Cartographe</bold></yellow>"
    text: "Mes missions te permettront de découvrir de nouveaux secrets du Wild ! Tu pourrais explorer de nouvelles régions, découvrir des biomes inconnus, ou encore trouver des points d'intérêt uniques. Veux-tu te joindre à moi dans cette quête d'exploration ?"
    choices:
      - text: "Retour"
        next: accueil
  waypoints_importance:
    speaker: "<yellow><bold>Mira la Cartographe</bold></yellow>"
    text: "Les waypoints sont vitaux pour un aventurier ! Ils te permettent de te repérer et d'explorer le monde plus facilement. Chaque découverte enrichit notre compréhension du Wild et sa cartographie. Es-tu prêt à en découvrir plus ?"
    choices:
      - text: "Retour"
        next: accueil
  sortie:
    speaker: "<yellow><bold>Mira la Cartographe</bold></yellow>"
    text: "Bonne chance dans tes aventures, et n'hésite pas à revenir me voir à tout moment !"
    choices:
      - text: "Au revoir !"
        actions:
          - type: CLOSE
