# Dialogue du Bûcheron Bob (issue #80), donneur de la quête renouvelable rpgquest:woodcutters_request
# (quests/woodcutters_request.yml, « giver: woodcutter_bob »). Id = id du PNJ, convention du projet :
# c'est la clé qu'ouvre un clic droit sur le PNJ (DialogueCitizensNpcInteractListener). Ce fichier
# ne crée, ne déplace ni ne lie jamais le PNJ lui-même.
#
# Avant ce fichier, Bob n'avait AUCUN dialogue : le champ « giver » d'une quête n'est qu'une
# déclaration (catalogue /npcs, avertissement GIVER_NO_DIALOGUE), il ne propose rien à lui seul.
# Un clic droit sur Bob n'ouvrait donc rien, et la quête ne pouvait pas être acceptée.
#
# Règles (mêmes que les PNJ récurrents de #13) :
#  - L'offre n'apparaît que si la quête est réellement acceptable MAINTENANT (QUEST_AVAILABLE : ni
#    active, prérequis remplis) ; seul « Commencer (j'accepte) » porte le START_QUEST (#238).
#  - Issue #778 : la quête n'a plus AUCUN prérequis (l'ancien verrou « Premiers pas », quête retirée,
#    a disparu avec elle). Bob ne renvoie plus vers aucune autre quête ni vers le garde : tant que
#    la tâche n'est pas en cours, « Du travail ? » mène directement à son offre.
#  - L'étape « report_to_npc » (TALK_TO_NPC woodcutter_bob) progresse sur le même clic, AVANT
#    l'ouverture de ce dialogue (QuestCitizensNpcInteractListener, priorité LOW) : rapporter le bois
#    se fait en parlant à Bob, sans bouton dédié.
id: rpgquest:woodcutter_bob
start: greeting

nodes:
  greeting:
    speaker: "Bûcheron Bob"
    text: "<white>Ah, un voyageur ! Le village a toujours besoin de bois, et mes bras ne suffisent plus.</white>"
    choices:
      - text: "Du travail ?"
        conditions:
          - type: QUEST_AVAILABLE
            quest: rpgquest:woodcutters_request
        next: offer
      - text: "Où en est ma tâche ?"
        conditions:
          - type: QUEST_STATE
            quest: rpgquest:woodcutters_request
            state: ACTIVE
        next: in_progress
      - text: "Qui es-tu ?"
        next: who
      - text: "Au revoir"
        actions:
          - type: CLOSE

  offer:
    speaker: "Bûcheron Bob"
    text: "<white>La quête s'appelle <gold>La requête du bûcheron</gold>.</white><newline><gray>But : remplir la réserve de bois du village.</gray><newline><gray>Ce qu'il faudra faire : couper des bûches de chêne, puis revenir me parler. Le nombre exact s'affichera dans le chat et restera dans ton journal de quêtes.</gray><newline><gray>Tu pourras recommencer quand tu voudras.</gray>"
    choices:
      - text: "Commencer (j'accepte)"
        actions:
          - type: START_QUEST
            quest: rpgquest:woodcutters_request
        next: accepted
      - text: "Plus tard"
        next: greeting
      - text: "Refuser"
        next: refused

  accepted:
    speaker: "Bûcheron Bob"
    text: "<green>Merci !</green> <gray>Ta tâche est notée dans ton journal de quêtes. Reviens me parler quand tu auras ton bois.</gray>"
    choices:
      - text: "En route"
        actions:
          - type: CLOSE

  refused:
    speaker: "Bûcheron Bob"
    text: "<gray>Pas de souci. Si tu changes d'avis, je ne bouge pas d'ici.</gray>"
    choices:
      - text: "Au revoir"
        actions:
          - type: CLOSE

  in_progress:
    speaker: "Bûcheron Bob"
    text: "<white>La réserve attend toujours son bois.</white> <gray>Ton journal de quêtes indique combien de bûches il me faut encore. Reviens me parler une fois qu'elles sont coupées.</gray>"
    choices:
      - text: "Retour"
        next: greeting

  who:
    speaker: "Bûcheron Bob"
    text: "<gray>Bob, bûcheron du village depuis toujours. Chaque planche des maisons d'ici est passée par ma hache.</gray>"
    choices:
      - text: "Retour"
        next: greeting
