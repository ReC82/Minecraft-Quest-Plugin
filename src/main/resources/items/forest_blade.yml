id: rpgquest:forest_blade
type: WEAPON
material: DIAMOND_SWORD
name: "<green>Lame de la forêt</green>"
lore:
  - "<gray>Forgée par les esprits de la forêt.</gray>"
  - "<dark_gray>Chaque coup murmure entre les feuilles.</dark_gray>"
rarity: RARE
stackable: false
max-durability: 1800
# Résolu par resource-pack/assets/rpgquest/models/item/forest_blade.json si le
# resource pack (optionnel) est installé ; apparence vanilla (DIAMOND_SWORD)
# sinon.
item-model: rpgquest:forest_blade

attributes:
  - attribute: attack_damage
    amount: 4.0
    operation: ADD_NUMBER
    slot: mainhand
  - attribute: movement_speed
    amount: 0.05
    operation: ADD_SCALAR
    slot: mainhand

enchantments:
  - type: SHARPNESS
    level: 3
  - type: UNBREAKING
    level: 2

gameplay-tags:
  - "starter_weapon"
  - "forest"

special-behavior: "forest_blade_leaf_trail"

# Comportement de combat (feature/08) : dégâts et vitesse d'attaque en bonus
# additifs (compatibles avec Tranchant, déjà pris en compte par le jeu avant
# que cet événement ne se déclenche), chance de critique, effet conditionnel
# à cooldown, particules/message sur coup notable.
combat:
  base-damage: 1.5
  attack-speed-bonus: 0.2
  critical-chance: 0.2
  critical-multiplier: 1.5
  hit-message: "<red>Coup critique !</red> <gray>(<damage> dégâts)</gray>"
  particle: CRIT
  particle-count: 10
  effect:
    ability-id: "leaf_trail_slow"
    type: SLOWNESS
    duration-ticks: 60
    amplifier: 1
    chance: 0.25
    cooldown-seconds: 8

crafting:
  craftable: false
