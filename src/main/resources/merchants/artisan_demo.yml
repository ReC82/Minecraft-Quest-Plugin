# Atelier d'artisan de démonstration (issue #18).
# Un catalogue « type: CRAFT » ne propose QUE des recettes du catalogue des prix :
# chaque offre cite un prix de fabrication (CRAFT) créé dans PlugAdmin → Prix et coûts
# (fichier prices.yml). Tant que les prix cités n'y existent pas (ou sont désactivés),
# chaque offre est affichée « Offre indisponible » et rien ne se fabrique — aucun prix ni
# aucune recette n'est jamais inventé.
#
# Recettes à créer dans PlugAdmin pour l'essayer (nature « Fabrication », valeurs libres,
# marquées « démonstration ») :
#   demo_recette_ingredients — ingrédients seuls   (ex. 1 × BREAD contre 3 × WHEAT, 0 pièce)
#   demo_recette_pieces      — pièces seules       (ex. 1 × LANTERN contre 12 pièces)
#   demo_recette_mixte       — ingrédients + pièces (ex. 1 × IRON_SWORD contre 2 × IRON_INGOT + 1 × STICK + 5 pièces)
#
# Ouverture : /merchant open rpgquest:artisan_demo (administrateur), ou une action de
# dialogue OPEN_MERCHANT merchant: rpgquest:artisan_demo. Voir MERCHANT_FORMAT.md.

id: rpgquest:artisan_demo
title: "<gold>Atelier de l'artisan</gold>"
type: CRAFT

offers:
  - price-ref: demo_recette_ingredients
  - price-ref: demo_recette_pieces
  - price-ref: demo_recette_mixte
