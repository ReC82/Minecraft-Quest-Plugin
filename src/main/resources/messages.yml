# Messages MiniMessage envoyés par les commandes /quest et les notifications
# de progression. Personnalisables sans recompiler ; rechargés avec
# /quest admin reload.
# Placeholders disponibles selon le message : <quest> <category> <state>
# <objective> <current> <total> <missing> <permission> <amount> <item>
#
# started-title/started-subtitle et completed-title/completed-subtitle sont
# affichés via un Title Adventure (jamais le chat) au démarrage/à la fin
# d'une quête ; objective-progress via l'ActionBar à chaque progression d'un
# objectif (qu'elle le complète ou non). Volontairement hors du chat pour ne
# pas le spammer — voir docs-site/quests.html.
#
# reward-summary-header/reward-line-* sont l'exception : envoyés dans le chat,
# une seule fois à la remise (jamais à l'acceptation ni en cours de route), et
# seulement pour les récompenses réellement accordées par CETTE quête (une
# quête sans récompense ITEM n'affiche jamais reward-line-item). reward-line-
# special couvre les récompenses COMMAND (ex. objet personnalisé donné via
# /customitem give) : le contenu exact d'une commande arbitraire n'est pas
# inspectable, donc ce message reste volontairement générique plutôt que
# d'inventer un nom d'objet.
#
# reward-money-credited / reward-money-failed (issue #16) ne font PAS partie du
# résumé ci-dessus et arrivent séparément, un court instant plus tard : le
# crédit du portefeuille est asynchrone, et ces messages ne sont envoyés
# qu'APRÈS la réponse de la base. reward-money-credited n'est donc jamais
# affiché pour un gain qui n'a pas eu lieu, et reward-money-failed dit
# honnêtement l'échec plutôt que de le taire. Ils partent dans le CHAT et
# jamais dans l'ActionBar, qui appartient à la progression des objectifs : une
# notification d'économie y effacerait l'avancement affiché.

quest:
  already-active: "<red>Tu as déjà accepté :</red> <white><quest></white>"
  not-repeatable: "<red>Quête déjà terminée (non répétable) :</red> <white><quest></white>"
  # Issue #13 : quête renouvelable reprise trop tôt (délai « cooldown: » du fichier de quête).
  on-cooldown: "<yellow>Rien de nouveau pour l'instant :</yellow> <white><quest></white> <gray>— reviens dans <time>.</gray>"
  prerequisites-missing: "<red>Prérequis manquant(s) pour</red> <white><quest></white><red> :</red> <white><missing></white>"
  unknown: "<red>Quête inconnue :</red> <white><quest></white>"
  abandoned: "<yellow>Quête abandonnée :</yellow> <white><quest></white>"
  nothing-to-abandon: "<red>Aucune quête active à abandonner :</red> <white><quest></white>"
  force-completed: "<gold>Quête forcée à terminée (admin) :</gold> <white><quest></white>"
  progress-empty: "<gray>Aucune quête en cours.</gray>"
  progress-line: "<yellow><quest></yellow> <gray>-</gray> <white><state></white>"
  progress-objective-line: "<gray> - <objective> :</gray> <white><current>/<total></white>"
  list-header: "<gold><bold>Quêtes</bold></gold>"
  list-entry: "<white><quest></white> <gray>[<category>] -</gray> <yellow><state></yellow>"
  started-title: "<green><bold>Quête commencée</bold></green>"
  started-subtitle: "<white><quest></white>"
  # Issue #235 : le Title disparaît en deux secondes et ne dit que le nom de la quête. Ces deux
  # lignes partent dans le CHAT au démarrage, pour que le joueur sache immédiatement QUOI FAIRE —
  # c'est l'exception assumée à la règle « jamais le chat » ci-dessus, et elle ne concerne que le
  # démarrage (rare). Le libellé d'un objectif est le même que partout ailleurs (journal, ActionBar).
  # Issue #70 : mêmes lignes au passage à l'étape suivante (step-advanced-header) ; un objectif
  # binaire (parler à un PNJ, atteindre un lieu) n'affiche pas de quantité (started-objective-single).
  started-objectives-header: "<green><bold>Quête commencée :</bold></green> <white><quest></white> <gray>— à faire (suivi dans</gray> <white>/quests</white><gray>) :</gray>"
  started-objective: "<yellow> • <objective></yellow> <gray>(x<total>)</gray>"
  started-objective-single: "<yellow> • <objective></yellow>"
  step-advanced-header: "<gold><bold>Étape suivante :</bold></gold> <white><quest></white> <gray>— à faire maintenant (suivi dans</gray> <white>/quests</white><gray>) :</gray>"
  objective-progress: "<yellow><objective></yellow> <gray><current>/<total></gray>"
  # Issue #178 (et #69/#209) : quand UN même événement fait progresser plusieurs quêtes (une ville
  # découverte compte pour deux quêtes), chaque ligne nomme sa quête pour rester lisible.
  objective-progress-named: "<white><quest></white> <dark_gray>·</dark_gray> <yellow><objective></yellow> <gray><current>/<total></gray>"
  completed-title: "<gold><bold>Quête terminée</bold></gold>"
  completed-subtitle: "<white><quest></white>"
  reward-summary-header: "<gold><bold>Quête terminée :</bold></gold> <white><quest></white> <gray>— récompenses :</gray>"
  reward-line-experience: "<yellow> + <amount> XP</yellow>"
  reward-line-item: "<yellow> + <amount>x <item></yellow>"
  reward-line-special: "<yellow> + Récompense spéciale</yellow>"
  # Issue #177 : tirage d'une table de récompenses aléatoires. <item> = récompense gagnée, remise dans
  # l'inventaire juste après (attend s'il est plein) ; <table> = nom de la table.
  reward-line-table-win: "<gold> + <item></gold> <gray>(tirage « <table> »)</gray>"
  reward-line-table-none: "<gray> + Tirage « <table> » : pas de gain cette fois</gray>"
  reward-line-table-unavailable: "<gray> + Tirage « <table> » indisponible — signale-le à un administrateur</gray>"
  reward-money-credited: "<gold>Récompense de</gold> <white><quest></white> <gold>:</gold> <yellow>+<amount> <currency></yellow> <gray>— solde :</gray> <white><balance></white>"
  reward-money-failed: "<red>Ta récompense en <currency> n'a pas pu être créditée. Rien n'a été perdu de ta progression : signale-le à un administrateur.</red>"
  # Issue #166 : récompense « Cœur supplémentaire ». Envoyés APRÈS l'écriture du droit en base,
  # comme le crédit monétaire. <hearts> = cœurs gagnés, <total> = vie maximale en cœurs après
  # application (toutes sources : équipement, effets, autres plugins compris).
  reward-heart-granted: "<red>❤</red> <gold>Récompense de</gold> <white><quest></white> <gold>:</gold> <red>+<hearts> cœur(s)</red> <gray>— vie maximale :</gray> <white><total> cœurs</white>"
  reward-heart-already: "<gray>Tu as déjà reçu le cœur de</gray> <white><quest></white><gray> : il ne s'obtient qu'une fois.</gray>"
  reward-heart-capped: "<gold>Cœur de</gold> <white><quest></white> <gold>acquis</gold><gray>, mais le plafond de <cap> cœurs supplémentaires est atteint : il s'activera si le plafond est relevé.</gray>"
  reward-heart-failed: "<red>Ton cœur supplémentaire n'a pas pu être enregistré. Signale-le à un administrateur.</red>"
  # Issue #318 : récompenses d'objets qui ne tiennent pas dans l'inventaire. Rien n'est accordé ni
  # jeté au sol : la quête attend (journal « Prête à remettre ») et se termine d'elle-même dès que
  # le joueur a libéré <slots> emplacement(s). turn-in-inventory-full : remise demandée (PNJ,
  # commande) refusée pour la même raison — la quête reste en cours, il suffit de réessayer.
  reward-inventory-full: "<red>Inventaire plein :</red> <white><quest></white> <gray>est terminée, mais ses récompenses ne tiennent pas. Libère <white><slots></white> emplacement(s) : rien n'est perdu, la remise se fera dès qu'il y aura de la place.</gray>"
  turn-in-inventory-full: "<red>Inventaire plein :</red> <gray>les récompenses de</gray> <white><quest></white> <gray>ne tiennent pas. Libère <white><slots></white> emplacement(s) puis réessaie — rien n'a été remis ni perdu.</gray>"

  # Remise d'objets à un PNJ (issue #123, DELIVER_ITEM_TO_NPC). Envoyés dans le CHAT, jamais en
  # ActionBar : une remise groupée touche plusieurs objectifs d'un coup et autant de messages
  # d'ActionBar s'écraseraient l'un l'autre. <items> et <missing> sont des listes déjà rendues
  # (« 2 × Cuir, 1 × Pierre »), avec les noms d'objets traduits par le client.
  delivery-delivered: "<green>Matériaux remis :</green> <white><items></white>"
  delivery-remaining: "<gray>Il te manque encore :</gray> <white><missing></white>"
  delivery-all-done: "<gold>Tu as remis tout ce qui était demandé.</gold>"
  delivery-nothing-useful: "<gray>Tu n'as rien d'utile à me remettre pour l'instant.</gray>"
  delivery-already-complete: "<gray>Tu m'as déjà remis tout ce que je t'avais demandé.</gray>"
  delivery-none: "<gray>Je n'attends aucun matériau de ta part.</gray>"

city:
  # Issue #178 — titre natif plein écran à la PREMIÈRE entrée dans une ville (jamais répété).
  # <city> = nom affiché actuel de la ville. Durées : config.yml, cities.discovery.title.
  welcome-title: "<gold>Bienvenue à <city></gold>"
  welcome-subtitle: "<gray>Nouvelle ville découverte</gray>"
permission:
  denied: "<red>Permission manquante :</red> <white><permission></white>"

# Feedback Story (story.StoryService) : envoyé dans le CHAT, jamais en Title/Subtitle comme les
# messages de quête ci-dessus — QuestProgressEngine affiche déjà son propre Title "Quête commencée"
# à chaque démarrage de quête (Story ou non), un second Title juste avant/après créerait une course
# d'affichage (le second écrase toujours le premier). Le chat n'entre jamais en conflit et garde un
# historique consultable du fil de la story. Placeholders : <story> (nom de la story), <quest> (titre
# de la quête).
story:
  started: "<green><bold>Nouvelle aventure :</bold></green> <white><story></white>"
  next-objective: "<green>Nouvel objectif :</green> <white><quest></white>"
  completed: "<gold><bold>Aventure terminée :</bold></gold> <white><story></white>"

# Droits opérateur Minecraft (OP) changés depuis PlugAdmin (issue #316). Message PRIVÉ, envoyé
# seulement après un changement réel. « while-away » : résumé unique à la connexion suivante,
# si l'état a changé pendant l'absence du joueur. Ne parle que d'OP Minecraft.
player:
  op-granted: "<gold>Tes droits opérateur Minecraft (OP) ont été activés.</gold>"
  op-revoked: "<gold>Tes droits opérateur Minecraft (OP) ont été retirés.</gold>"
  op-granted-while-away: "<gold>Pendant ton absence, tes droits opérateur Minecraft (OP) ont été activés.</gold>"
  op-revoked-while-away: "<gold>Pendant ton absence, tes droits opérateur Minecraft (OP) ont été retirés.</gold>"
