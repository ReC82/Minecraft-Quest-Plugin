name: RPGQuest
version: ${version}
main: com.lodygames.rpgquest.RPGQuestPlugin
api-version: '1.21'
author: LodyGames
description: Plugin RPG pour Paper piloté par des quêtes YAML.
folia-supported: false

# Citizens n'est jamais requis pour démarrer : présent, il devient le système de PNJ prioritaire
# (voir com.lodygames.rpgquest.npc) ; absent, les entités vanilla marquées via /rpgadmin npc tag
# continuent de fonctionner comme avant. softdepend (pas depend) garantit que, quand Citizens est
# installé, il est déjà activé avant RPGQuest (ordre requis pour détecter sa présence correctement),
# sans jamais empêcher RPGQuest de démarrer en son absence.
softdepend:
  - Citizens

libraries:
  - org.xerial:sqlite-jdbc:3.53.2.1

commands:
  rpgquest:
    description: Commande principale de RPGQuest.
    usage: /<command> <version|help|profile [joueur]|reload>
  quest:
    description: Quêtes des joueurs et administration des définitions.
    usage: /<command> <list|accept|progress|abandon|complete|admin reload|validate|reset <joueur> <id|all>>
  dialogue:
    description: Ouvre un dialogue pour un joueur (administration).
    usage: /<command> open <joueur> <dialogueId>
  quests:
    description: Ouvre le journal de quêtes (menu paginé).
    usage: /<command>
  customitem:
    description: Registre d'objets personnalisés (armes, outils, ressources).
    usage: /<command> <give <joueur> <id> [quantité]|list|inspect>
  resourcenode:
    description: Nœuds de ressource récoltables (administration).
    usage: /<command> <create <typeId>|remove|inspect>
  rpgadmin:
    description: Commandes d'administration du monde (aplatissement, zones, portails, PNJ, spawn, mondes supplémentaires...).
    usage: /<command> flatten <rayon> [hauteur]|confirm|cancel|undo|zone ...|portal create|delete|list|info|setdestination|npc tag [id]|untag|info|spawn set|tp|world create <name>|tp <name>|list|worldportal create <id> <destinationWorld>|info <id>|list|enable <id>|disable <id>|delete <id>
  money:
    description: Portefeuille et paiements entre joueurs.
    usage: /<command> [pay <joueur> <montant>|admin <give|take|set> <joueur> <montant>]
  merchant:
    description: Marchands PNJ (administration) — voir docs/ECONOMY.md.
    usage: /<command> <reload|validate|list>
  market:
    description: Marché entre joueurs — voir docs/ECONOMY.md.
    usage: /<command> [sell <prix>|cancel <id>|admin list]
  claim:
    description: Claims de terrain protégés entre joueurs — voir docs/CLAIMS.md.
    usage: /<command> wand|create <id>|delete|info|trust <joueur>|untrust <joueur>|list|flag redstone <true|false>
  profile:
    description: Résumé de tes niveaux RPG (progression) — voir docs/PROGRESSION.md.
    usage: /<command>
  skills:
    description: Détail de tes compétences RPG et outils d'administration de test — voir docs/PROGRESSION.md.
    usage: /<command> [admin <grant|set> <joueur> <compétence> <montant>]
  backpack:
    description: Sacs à dos persistants (Small/Medium/Large) — voir docs/BACKPACKS.md.
    usage: /<command> [recover [numéro]|admin <grant|revoke> <joueur> [taille]]
  store:
    description: Historique de la boutique web (administration) — voir docs/STORE.md.
    usage: /<command> history [joueur|uuid]

permissions:
  rpgquest.admin:
    description: Accès aux commandes d'administration de RPGQuest (ex. /rpgquest reload, /quest admin, /quest complete, /customitem give|list).
    default: op
  rpgquest.quest:
    description: Accès aux commandes de quêtes joueur (/quest list|accept|progress|abandon).
    default: true
  rpgquest.item:
    description: Accès aux commandes d'objets personnalisés joueur (/customitem inspect).
    default: true
  # --- Administration du monde (issue #27) -------------------------------------------------------
  # rpgquest.admin.world reste le parapluie historique : il porte en enfants TOUTES les actions
  # /rpgadmin, la construction (rpgquest.build.*) et l'administration des claims. Un OP, ou un rôle
  # existant à qui rpgquest.admin.world était accordé, garde donc exactement le même accès qu'avant.
  # Pour déléguer sans op : accorder uniquement le(s) nœud(s) rpgquest.admin.<action> voulu(s).
  rpgquest.admin.world:
    description: Parapluie d'administration du monde — accorde toutes les actions /rpgadmin, la construction partout et l'administration des claims.
    default: op
    children:
      rpgquest.build.*: true
      rpgquest.build.zone: true
      rpgquest.claim.bypass: true
      rpgquest.claim.admin: true
      rpgquest.admin.flatten: true
      rpgquest.admin.zone: true
      rpgquest.admin.portal: true
      rpgquest.admin.mob: true
      rpgquest.admin.npc: true
      rpgquest.admin.spawn: true
      rpgquest.admin.worlds: true
      rpgquest.admin.waystone: true
      rpgquest.admin.story: true
      rpgquest.admin.player: true
      rpgquest.admin.guide: true
  rpgquest.admin.flatten:
    description: "/rpgadmin flatten — aperçu et exécution d'aplatissement de terrain."
    default: false
  rpgquest.admin.zone:
    description: "/rpgadmin zone — création/suppression/inspection des zones protégées."
    default: false
  rpgquest.admin.portal:
    description: "/rpgadmin portal et /rpgadmin worldportal — portails et destinations."
    default: false
  rpgquest.admin.mob:
    description: "/rpgadmin mob — mobs spéciaux (spawn de test, inspection, rechargement)."
    default: false
  rpgquest.admin.npc:
    description: "/rpgadmin npc tag|untag|info — identité RPGQuest des PNJ (rôle « NPC editor »)."
    default: false
  rpgquest.admin.spawn:
    description: "/rpgadmin spawn set|tp — point d'apparition du serveur."
    default: false
  rpgquest.admin.worlds:
    description: "/rpgadmin world create|tp|list — mondes supplémentaires."
    default: false
  rpgquest.admin.waystone:
    description: "/rpgadmin waystone — outils de test des Waystones du Wild."
    default: false
  rpgquest.admin.story:
    description: "/rpgadmin story — progression de storyline (diagnostic/test)."
    default: false
  rpgquest.admin.player:
    description: "/rpgadmin player resetnew — réinitialisation « nouveau joueur » (destructif)."
    default: false
  rpgquest.admin.guide:
    description: "/rpgadmin guide list|info — diagnostic en lecture seule des Guides de Hub."
    default: false
  # --- Construction par monde / Hub (issue #27) : ne contourne JAMAIS un claim joueur ------------
  rpgquest.build.*:
    description: Construire dans toutes les zones de build gérées par RPGQuest (tous Hubs + Wild + mondes spécialisés).
    default: op
    children:
      rpgquest.build.hub.*: true
      rpgquest.build.wild: true
      rpgquest.build.zone: true
  rpgquest.build.hub.*:
    description: Construire dans tous les Hubs, quel que soit leur identifiant.
    default: false
  rpgquest.build.hub.0:
    description: Construire dans le Hub 0 uniquement (monde hub.world par défaut).
    default: false
  rpgquest.build.wild:
    description: Construire des structures administratives dans le Wild — n'accorde aucun bypass de claim.
    default: false
  rpgquest.build.zone:
    description: Construire / interagir librement à l'intérieur de n'importe quelle zone protégée RPGQuest.
    default: false
  # Hubs supplémentaires : déclarer ici rpgquest.build.hub.<id> (ou via LuckPerms / permissions.yml)
  # et mapper le monde dans config.yml -> permissions.build-areas. Idem rpgquest.build.world.<clé>
  # pour un monde spécialisé (ex. rpgquest.build.world.claims).
  # --- Claims : administration et contournement, séparés du build (issue #27) -------------------
  rpgquest.claim.bypass:
    description: Ignorer la protection d'un claim joueur (casse/pose/conteneurs/animaux). Jamais accordé par une permission de build.
    default: op
  rpgquest.claim.admin:
    description: Outils d'administration des claims (/claim admin — suppression d'un claim tiers, tp, sendhome).
    default: op
  rpgquest.money:
    description: Accès aux commandes joueur d'économie (/money, /money pay).
    default: true
  rpgquest.market:
    description: Accès au marché entre joueurs (/market, /market sell|cancel).
    default: true
  rpgquest.claim:
    description: Accès aux claims de terrain (/claim).
    default: true
  rpgquest.progression:
    description: Accès aux commandes joueur de progression RPG (/profile, /skills).
    default: true
  rpgquest.backpack:
    description: Accès à la commande /backpack (ouverture, récupération) pour un joueur qui a déjà un palier.
    default: true
  rpgquest.backpack.free:
    description: Permission de secours — accorde le palier SMALL sans avantage explicite (voir docs/BACKPACKS.md).
    default: true
