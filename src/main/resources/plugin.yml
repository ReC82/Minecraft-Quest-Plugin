name: RPGQuest
version: ${version}
main: com.lodygames.rpgquest.RPGQuestPlugin
api-version: '1.21'
author: LodyGames
description: Plugin RPG pour Paper piloté par des quêtes YAML.
folia-supported: false

# Citizens n'est jamais requis pour démarrer : présent, il devient le système de PNJ prioritaire
# (voir com.lodygames.rpgquest.npc) ; absent, les entités vanilla marquées via /rpgadmin npc tag
# continuent de fonctionner comme avant. softdepend (pas depend) garantit que, quand Citizens est
# installé, il est déjà activé avant RPGQuest (ordre requis pour détecter sa présence correctement),
# sans jamais empêcher RPGQuest de démarrer en son absence.
# LuckPerms (issue #200) : jamais requis. Présent, le pont du Control Panel peut écrire des droits
# Minecraft par monde via son API ; absent, le plugin démarre et fonctionne exactement comme avant,
# et le pont se déclare INDISPONIBLE avec son motif plutôt que de prétendre avoir réussi.
softdepend:
  - Citizens
  - LuckPerms

libraries:
  - org.xerial:sqlite-jdbc:3.53.2.1
  # Backend MySQL/MariaDB (issue #41) — utilisés seulement si database.type: mysql,
  # mais téléchargés au démarrage par le LibraryLoader de Paper dans tous les cas.
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  rpgquest:
    description: Commande principale de RPGQuest.
    usage: /<command> <version|help|profile [joueur]|reload>
  quest:
    description: Quêtes des joueurs et administration des définitions.
    usage: /<command> <list|accept|progress|abandon|complete|admin reload|validate|reset <joueur> <id|all>>
  dialogue:
    description: Ouvre un dialogue pour un joueur (administration).
    usage: /<command> open <joueur> <dialogueId>
  quests:
    description: Ouvre le journal de quêtes (menu paginé).
    usage: /<command>
  customitem:
    description: Registre d'objets personnalisés (armes, outils, ressources).
    usage: /<command> <give <joueur> <id> [quantité]|list|inspect>
  resourcenode:
    description: Nœuds de ressource récoltables (administration).
    usage: /<command> <create <typeId>|remove|inspect>
  rpgadmin:
    description: Commandes d'administration du monde (aplatissement, zones, portails, PNJ, spawn, mondes supplémentaires...).
    usage: /<command> flatten <rayon> [hauteur]|confirm|cancel|undo|zone ...|portal create|delete|list|info|setdestination|npc tag [id]|untag|info|spawn set|tp|world create <name>|tp <name>|list|worldportal create <id> <destinationWorld>|info <id>|list|enable <id>|disable <id>|delete <id>
  money:
    description: Portefeuille et paiements entre joueurs.
    usage: /<command> [pay <joueur> <montant>|admin <give|take|set> <joueur> <montant>]
  merchant:
    description: Marchands PNJ (administration) — voir docs/ECONOMY.md.
    usage: /<command> <reload|validate|list>
  market:
    description: Marché entre joueurs — voir docs/ECONOMY.md.
    usage: /<command> [sell <prix>|cancel <id>|admin list]
  claim:
    description: Claims de terrain protégés entre joueurs — voir docs/CLAIMS.md.
    usage: /<command> wand|create <id>|delete|info|trust <joueur>|untrust <joueur>|list|flag redstone <true|false>
  profile:
    description: Résumé de tes niveaux RPG (progression) — voir docs/PROGRESSION.md.
    usage: /<command>
  skills:
    description: Détail de tes compétences RPG et outils d'administration de test — voir docs/PROGRESSION.md.
    usage: /<command> [admin <grant|set> <joueur> <compétence> <montant>]
  backpack:
    description: Sacs à dos persistants (Small/Medium/Large) — voir docs/BACKPACKS.md.
    usage: /<command> [recover [numéro]|admin <grant|revoke> <joueur> [taille]]
  store:
    description: Historique de la boutique web (administration) — voir docs/STORE.md.
    usage: /<command> history [joueur|uuid]

permissions:
  rpgquest.admin:
    description: Accès aux commandes d'administration de RPGQuest (ex. /rpgquest reload, /quest admin, /quest complete, /customitem give|list).
    default: op
  rpgquest.quest:
    description: Accès aux commandes de quêtes joueur (/quest list|accept|progress|abandon).
    default: true
  rpgquest.item:
    description: Accès aux commandes d'objets personnalisés joueur (/customitem inspect).
    default: true
  rpgquest.admin.world:
    description: "OMBRELLE HISTORIQUE (issues #27/#200). La détenir implique TOUS les droits découpés ci-dessous : construction dans les Hubs, bypass claims/zones/monde des claims, et toutes les branches de /rpgadmin. Conservée pour ne casser aucun administrateur existant. NE JAMAIS l'attribuer à un groupe builder ou éditeur de PNJ : elle donne tout."
    default: op
  rpgquest.admin.command:
    description: "Entrer dans /rpgadmin, SANS autoriser aucune branche (issue #200). Chaque sous-commande exige en plus son propre nœud, ou l'ombrelle rpgquest.admin.world. Un compte ne portant que ce nœud peut ouvrir la commande et n'exécuter aucune opération."
    default: false
  rpgquest.admin.npc:
    description: "Parent de la branche PNJ de /rpgadmin (issue #200) : autorise les trois sous-actions ci-dessous. Ne donne AUCUN droit de construction, aucun bypass de protection, et aucune autre branche de /rpgadmin."
    default: false
    children:
      rpgquest.admin.npc.tag: true
      rpgquest.admin.npc.untag: true
      rpgquest.admin.npc.info: true
  rpgquest.admin.npc.tag:
    description: "/rpgadmin npc tag — marque l'entité visée d'un identifiant RPGQuest stable. ATTENTION : ceci ne crée AUCUN PNJ Citizens ; la création passe par le Control Panel (npc.citizens.create) ou par les commandes de Citizens, qui ont leurs propres permissions."
    default: false
  rpgquest.admin.npc.untag:
    description: "/rpgadmin npc untag — retire le marquage RPGQuest de l'entité visée."
    default: false
  rpgquest.admin.npc.info:
    description: "/rpgadmin npc info — lecture seule du marquage de l'entité visée."
    default: false
  rpgquest.admin.buildsite:
    description: "Emplacements de construction (issue #213) : obtenir l'outil, créer un emplacement d'un clic droit, et lister les emplacements en jeu. Nœud DÉDIÉ, sans rapport avec WorldEdit — l'outil ne sélectionne aucune région et ne modifie aucun bloc. N'accorde aucun droit de construction, aucun bypass de protection et aucune autre branche de /rpgadmin. L'ombrelle rpgquest.admin.world l'implique."
    default: false
  rpgquest.build.hub.*:
    description: "Construire dans TOUS les mondes de Hub (issue #200). N'accorde aucun bypass de claim, de zone protégée, de waypoint, ni aucune commande d'administration."
    default: false
  rpgquest.build.wild:
    description: "Construire dans le Wild (issue #200). SANS EFFET à ce jour : le Wild n'a aucune restriction de construction, un joueur ordinaire y construit déjà librement. Ce nœud existe pour la convention et pour un éventuel verrou futur ; il n'accorde AUCUN bypass de zone protégée, de claim ou de waypoint — or le Wild en contient."
    default: false
  rpgquest.bypass.claim:
    description: "Contourner la protection des claims d'autrui (issue #200). Strictement distinct de toute permission de construction : un builder de Hub ne l'obtient jamais par sa permission de build."
    default: false
  rpgquest.bypass.zone:
    description: "Contourner la protection des zones (issue #200). Distinct des claims et de la construction."
    default: false
  rpgquest.bypass.claimworld:
    description: "Accès et règles administratifs du MONDE des claims (issue #200) : entrer sans être éligible et ignorer les règles de ce monde. Préserve le correctif #22 — l'entrée n'est jamais refusée à un porteur, et il reçoit malgré tout une Pierre de retour."
    default: false
  rpgquest.admin.travel.maintenance:
    description: "Autorise, APRÈS activation explicite via /rpgadmin travel maintenance on, à casser les blocs d'un waypoint ou d'une borne de voyage (issue #191). Volontairement PAS accordée aux opérateurs : un bypass implicite par statut OP permettait de détruire ces structures sans geste délibéré."
    default: false
  rpgquest.admin.debug:
    description: Permission stricte supplémentaire pour les écritures bas niveau de debug (/rpgadmin player variable set). Ne jamais accorder à un joueur normal.
    default: op
  rpgquest.admin.hub.combat:
    description: Bypass explicite (issues #30/#31), distinct de la construction, autorisant à infliger des dégâts aux entités protégées du Hub. Ne jamais accorder à un joueur normal.
    default: op
  rpgquest.money:
    description: Accès aux commandes joueur d'économie (/money, /money pay).
    default: true
  rpgquest.market:
    description: Accès au marché entre joueurs (/market, /market sell|cancel).
    default: true
  rpgquest.claim:
    description: Accès aux claims de terrain (/claim).
    default: true
  rpgquest.progression:
    description: Accès aux commandes joueur de progression RPG (/profile, /skills).
    default: true
  rpgquest.backpack:
    description: Accès à la commande /backpack (ouverture, récupération) pour un joueur qui a déjà un palier.
    default: true
  rpgquest.backpack.free:
    description: Permission de secours — accorde le palier SMALL sans avantage explicite (voir docs/BACKPACKS.md).
    default: true
