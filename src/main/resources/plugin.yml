name: RPGQuest
version: ${version}
main: be.lloyd.rpgquest.RPGQuestPlugin
api-version: '1.21'
author: Lloyd
description: Plugin RPG pour Paper piloté par des quêtes YAML.
folia-supported: false

libraries:
  - org.xerial:sqlite-jdbc:3.53.2.1

commands:
  rpgquest:
    description: Commande principale de RPGQuest.
    usage: /<command> <version|help|profile [joueur]|reload>

permissions:
  rpgquest.admin:
    description: Accès aux commandes d'administration de RPGQuest (ex. /rpgquest reload).
    default: op
