# Quête RPGQuest — éditée via l'éditeur guidé du Control Panel (#46).
id: rpgquest:crystal_hunt
title: "<gold>La chasse aux monstres</gold>"
description: "<gray>Le garde a besoin que tu prouves ta valeur au combat.</gray>"
category: "hunting"
icon: IRON_SWORD
repeatable: false
giver: guard
prerequisites:
  - rpgquest:first_steps

steps:
  - id: hunt_zombie
    objectives:
      - type: KILL_ENTITY
        entity: zombie
        amount: 5
  - id: hunt_skeleton
    objectives:
      - type: KILL_ENTITY
        entity: SKELETON
        amount: 5
  - id: hunt_spider
    objectives:
      - type: KILL_ENTITY
        entity: SPIDER
        amount: 5
  - id: report_to_guard
    objectives:
      - type: TALK_TO_NPC
        npc: guard

rewards:
  - type: EXPERIENCE
    amount: 100
  - type: ITEM
    material: IRON_PICKAXE
    amount: 1
  - type: VARIABLE
    key: "CLAIM_TIER_1"
    value: "true"

variables:
  crystal_hunt_started: "true"
