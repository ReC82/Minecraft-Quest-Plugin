# Issue #218 — montée au palier 4 du kit de départ (« Aventurier »). Les matériaux suivent les
# recettes vanilla des NOUVEAUTÉS du palier, jamais la reconstruction complète du kit ; aucun fer.
# Le palier n'est débloqué que par la récompense « rpgadmin kit grant-tier », qui refuse de sauter un
# palier ; la variable STARTER_KIT_TIER en garde la trace et sert aux conditions du Guide.
id: rpgquest:kit_tier4
title: "<gold>Aventurier</gold>"
description: >
  <gray>Rapporte au Guide de quoi améliorer ton équipement de secours : deux bâtons et une pierre pour une pelle en pierre, et sept cuirs pour des jambières. Tu peux lui
  donner tes matériaux au fur et à mesure : ce qui est remis est gardé en sécurité, même si tu
  meurs.</gray>
category: kit
icon: LEATHER_LEGGINGS
giver: guide
repeatable: false
prerequisites:
  - rpgquest:kit_tier3

steps:
  - id: rapporter_les_materiaux
    objectives:
      - type: DELIVER_ITEM_TO_NPC
        npc: guide
        material: STICK
        amount: 2
      - type: DELIVER_ITEM_TO_NPC
        npc: guide
        material: COBBLESTONE
        amount: 1
      - type: DELIVER_ITEM_TO_NPC
        npc: guide
        material: LEATHER
        amount: 7

rewards:
  - type: COMMAND
    command: "rpgadmin kit grant-tier %player% 4"
  - type: EXPERIENCE
    amount: 40
