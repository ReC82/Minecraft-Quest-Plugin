id: maison_du_botaniste
name: "Maison du Botaniste"
kind: habitable
front: NORTH
size:
  x: 17
  y: 11
  z: 21
anchor:
  x: 8
  y: 1
  z: 10
steps:
  # Fondation Corps Principal
  - op: box
    from: [0, 0, 0]
    to: [16, 0, 20]
    block: minecraft:stone_bricks

  # Murs Corps Principal
  - op: walls
    from: [0, 1, 0]
    to: [16, 6, 20]
    block: minecraft:oak_planks

  # Charpente Corps Principal
  - op: pillars
    from: [0, 1, 0]
    to: [16, 6, 20]
    spacing: 5
    block: minecraft:oak_log

  # Toit Corps Principal
  - op: gable
    from: [0, 7, 0]
    to: [16, 10, 20]
    axis: x
    fill: minecraft:oak_planks
    block: minecraft:spruce_stairs

  # Serre (avec murs en panneaux de verre)
  - op: walls
    from: [3, 6, 1]
    to: [13, 10, 10]
    block: minecraft:glass_pane

  # Toit Serre
  - op: gable
    from: [3, 7, 1]
    to: [13, 10, 10]
    axis: x
    fill: minecraft:spruce_planks
    block: minecraft:glass

  # Entrée principale
  - op: door
    facade: FRONT
    offset: 8
    block: minecraft:oak_door

  # Allée centrale
  - op: box
    from: [1, 0, 1]
    to: [15, 0, 19]
    block: minecraft:stone_bricks

  # Table de travail
  - op: box
    from: [4, 0, 18]
    to: [4, 0, 18]
    block: minecraft:spruce_slab
  - op: box
    from: [5, 0, 18]
    to: [5, 0, 18]
    block: minecraft:oak_fence

  # Espaces de vie et ateliers
  - op: box
    from: [13, 0, 16]
    to: [15, 0, 19]
    block: minecraft:oak_planks

  # Bacs de plantation
  - op: box
    from: [4, 0, 2]
    to: [12, 0, 9]
    block: minecraft:podzol

  # Lumières
  - op: light
    from: [8, 7, 5]
    block: minecraft:lantern
  - op: light
    from: [8, 10, 5]
    block: minecraft:lantern

  # Rangements
  - op: box
    from: [14, 1, 17]
    to: [15, 1, 18]
    block: minecraft:barrel
  - op: box
    from: [13, 1, 17]
    block: minecraft:chest

  # Plantes en pot
  - op: box
    from: [5, 1, 3]
    to: [6, 1, 3]
    block: minecraft:flower_pot

  # Étagères de livres
  - op: box
    from: [1, 1, 16]
    to: [1, 2, 18]
    block: minecraft:bookshelf
